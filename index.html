  <!-- Área de Mensagem -->
  <div class="message-container">
    <h1 class="message-title" id="messageTitle">🎄 Feliz Natal! 🎄</h1>
    <p class="message-text" id="messageText">Desejo a você um Natal repleto de amor, paz e alegria!</p>
    <p class="message-from" id="messageFrom"></p>
  </div>

  <!-- Painel de Edição -->
  <div class="editor-panel" id="editorPanel">
    <button class="toggle-editor" id="toggleEditor" title="Criar mensagem">
      <span class="icon">✨</span>
      <span class="text">Criar Cartão</span>
    </button>

    <div class="editor-content" id="editorContent">
      <h2>✨ Personalize seu Cartão ✨</h2>

      <div class="input-group">
        <label for="inputTitle">Título</label>
        <input type="text" id="inputTitle" placeholder="Ex: Feliz Natal, João!" maxlength="50">
      </div>

      <div class="input-group">
        <label for="inputMessage">Mensagem</label>
        <textarea id="inputMessage" rows="4" placeholder="Escreva sua mensagem de Natal aqui..."
          maxlength="300"></textarea>
        <span class="char-count"><span id="charCount">0</span>/300</span>
      </div>

      <div class="input-group">
        <label for="inputFrom">De (seu nome)</label>
        <input type="text" id="inputFrom" placeholder="Ex: Com carinho, Maria" maxlength="50">
      </div>

      <div class="button-group">
        <button class="btn btn-preview" id="btnPreview">
          <span>👁️</span> Visualizar
        </button>
        <button class="btn btn-share" id="btnShare">
          <span>📤</span> Compartilhar
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de Compartilhamento -->
  <div class="share-modal" id="shareModal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">×</button>
      <h2>🎁 Compartilhe seu Cartão!</h2>
      <p>Copie o link abaixo e envie para quem você ama:</p>

      <div class="link-container">
        <input type="text" id="shareLink" readonly>
        <button class="btn-copy" id="btnCopy">
          <span id="copyIcon">📋</span>
          <span id="copyText">Copiar</span>
        </button>
      </div>

          </svg>
        </button>
        <button class="share-btn telegram" id="shareTelegram" title="Compartilhar no Telegram">

            <path fill="currentColor"
              d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z" />

              d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />

  <script>
    // Elementos DOM
    const messageTitle = document.getElementById('messageTitle');
    const messageText = document.getElementById('messageText');
    const messageFrom = document.getElementById('messageFrom');
    const inputTitle = document.getElementById('inputTitle');
    const inputMessage = document.getElementById('inputMessage');
    const inputFrom = document.getElementById('inputFrom');
    const charCount = document.getElementById('charCount');
    const toggleEditor = document.getElementById('toggleEditor');
    const editorContent = document.getElementById('editorContent');
    const editorPanel = document.getElementById('editorPanel');
    const btnPreview = document.getElementById('btnPreview');
    const btnShare = document.getElementById('btnShare');
    const shareModal = document.getElementById('shareModal');
    const modalClose = document.getElementById('modalClose');
    const shareLink = document.getElementById('shareLink');
    const btnCopy = document.getElementById('btnCopy');
    const copyText = document.getElementById('copyText');
    const copyIcon = document.getElementById('copyIcon');

    // Verificar parâmetros da URL ao carregar
    function loadFromURL() {
      const urlParams = new URLSearchParams(window.location.search);
      const title = urlParams.get('t');
      const message = urlParams.get('m');
      const from = urlParams.get('f');

      if (title || message || from) {
        // Esconde o editor se está visualizando um cartão compartilhado
        editorPanel.classList.add('viewing-mode');

        if (title) {
          messageTitle.textContent = decodeURIComponent(title);
        }
        if (message) {
          messageText.textContent = decodeURIComponent(message);
        }
        if (from) {
          messageFrom.textContent = decodeURIComponent(from);
          messageFrom.style.display = 'block';
        }
      }
    }

    // Toggle do editor
    toggleEditor.addEventListener('click', () => {
      editorContent.classList.toggle('open');
      toggleEditor.classList.toggle('active');
    });

    // Contador de caracteres
    inputMessage.addEventListener('input', () => {
      charCount.textContent = inputMessage.value.length;
    });

    // Preview da mensagem
    btnPreview.addEventListener('click', () => {
      const title = inputTitle.value.trim() || '🎄 Feliz Natal! 🎄';
      const message = inputMessage.value.trim() || 'Desejo a você um Natal repleto de amor, paz e alegria!';
      const from = inputFrom.value.trim();

      messageTitle.textContent = title;
      messageText.textContent = message;

      if (from) {
        messageFrom.textContent = from;
        messageFrom.style.display = 'block';
      } else {
        messageFrom.style.display = 'none';
      }

      // Animação de feedback
      messageTitle.classList.add('highlight');
      messageText.classList.add('highlight');
      setTimeout(() => {
        messageTitle.classList.remove('highlight');
        messageText.classList.remove('highlight');
      }, 1000);
    });

    // Gerar link de compartilhamento
    function generateShareLink() {
      const title = inputTitle.value.trim() || '🎄 Feliz Natal! 🎄';
      const message = inputMessage.value.trim() || 'Desejo a você um Natal repleto de amor, paz e alegria!';
      const from = inputFrom.value.trim();

      const baseUrl = window.location.origin + window.location.pathname;
      const params = new URLSearchParams();

      params.set('t', encodeURIComponent(title));
      params.set('m', encodeURIComponent(message));
      if (from) {
        params.set('f', encodeURIComponent(from));
      }

      return `${baseUrl}?${params.toString()}`;
    }

    // Abrir modal de compartilhamento
    btnShare.addEventListener('click', () => {
      const link = generateShareLink();
      shareLink.value = link;
      shareModal.classList.add('open');
    });

    // Fechar modal
    modalClose.addEventListener('click', () => {
      shareModal.classList.remove('open');
    });

    shareModal.addEventListener('click', (e) => {
      if (e.target === shareModal) {
        shareModal.classList.remove('open');
      }
    });

    // Copiar link
    btnCopy.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shareLink.value);
        copyText.textContent = 'Copiado!';
        copyIcon.textContent = '✅';
        setTimeout(() => {
          copyText.textContent = 'Copiar';
          copyIcon.textContent = '📋';
        }, 2000);
      } catch (err) {
        // Fallback para navegadores mais antigos
        shareLink.select();
        document.execCommand('copy');
        copyText.textContent = 'Copiado!';
        copyIcon.textContent = '✅';
        setTimeout(() => {
          copyText.textContent = 'Copiar';
          copyIcon.textContent = '📋';
        }, 2000);
      }
    });

    // Compartilhar no WhatsApp
    document.getElementById('shareWhatsApp').addEventListener('click', () => {
      const link = generateShareLink();
      const text = `🎄 Olha o cartão de Natal que eu fiz para você! ${link}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    });

    // Compartilhar no Telegram
    document.getElementById('shareTelegram').addEventListener('click', () => {
      const link = generateShareLink();
      const text = `🎄 Olha o cartão de Natal que eu fiz para você!`;
      window.open(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent(text)}`, '_blank');
    });

    // Compartilhar no Twitter/X
    document.getElementById('shareTwitter').addEventListener('click', () => {
      const link = generateShareLink();
      const text = `🎄 Olha o cartão de Natal que eu fiz! Feliz Natal! 🎁`;
      window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(link)}`, '_blank');
    });

    // Compartilhar no Facebook
    document.getElementById('shareFacebook').addEventListener('click', () => {
      const link = generateShareLink();
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}`, '_blank');
    });

    // Tecla ESC fecha o modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && shareModal.classList.contains('open')) {
        shareModal.classList.remove('open');
      }
    });

    // Carregar dados da URL ao iniciar
    loadFromURL();
  </script>
</body>

</html>
